# ==============================================================================
# SentinelBash - Master System Configuration
# ==============================================================================
# This configuration file controls the SentinelBash SOC Automation Engine.
# Override variables via environment variables or command-line flags where applicable.

# [ENVIRONMENT & RUNTIME PATHS]
# Default base directory (auto-detected if unset)
SENTINEL_ENV="${SENTINEL_ENV:-production}"

# Runtime and Log Directories (Relative paths resolve against repo root in dev mode)
SENTINEL_BASE_DIR="${SENTINEL_BASE_DIR:-}"
SENTINEL_CONFIG_DIR="${SENTINEL_CONFIG_DIR:-config}"
SENTINEL_DATA_DIR="${SENTINEL_DATA_DIR:-data}"
SENTINEL_LOG_DIR="${SENTINEL_LOG_DIR:-data/logs}"
SENTINEL_RUN_DIR="${SENTINEL_RUN_DIR:-data/run}"
SENTINEL_INCIDENT_DIR="${SENTINEL_INCIDENT_DIR:-data/incidents}"

# Named Pipe (FIFO) for streaming normalized logs between Ingestor & Detector
SENTINEL_FIFO="${SENTINEL_FIFO:-data/run/sentinel.fifo}"

# Target System Log Paths (Configurable for local dev/testing vs Linux production)
# In Linux production, typically /var/log/auth.log and /var/log/nginx/access.log
AUTH_LOG_PATH="${AUTH_LOG_PATH:-data/logs/auth.log}"
WEB_LOG_PATH="${WEB_LOG_PATH:-data/logs/nginx_access.log}"
SYS_LOG_PATH="${SYS_LOG_PATH:-data/logs/syslog}"

# Whitelist file location
WHITELIST_FILE="${WHITELIST_FILE:-config/whitelist.conf}"

# Active bans state file
BANS_STATE_FILE="${BANS_STATE_FILE:-data/run/active_bans.state}"

# [DETECTION HEURISTICS & THRESHOLDS]
# SSH Brute Force Detection
SSH_MAX_ATTEMPTS=5
SSH_WINDOW_SECONDS=60

# Web Application Probe / Scanner Detection
WEB_PROBE_THRESHOLD=3
WEB_WINDOW_SECONDS=45

# Privilege Escalation / Sudo Anomaly Detection
SUDO_FAIL_THRESHOLD=3
SUDO_WINDOW_SECONDS=60

# [SOAR CONTAINMENT & NETFILTER]
# Enable or disable automated firewall containment
CONTAINMENT_ENABLED=true

# Firewall driver: auto, iptables, ufw, mock
# 'auto': checks if iptables/ufw is executable and usable, falls back to 'mock' if non-root/dev
NETFILTER_DRIVER="auto"

# iptables rules configuration
IPTABLES_CHAIN="INPUT"
IPTABLES_TAG_PREFIX="SENTINEL"

# Default ban duration in seconds (0 = permanent until manual unban)
DEFAULT_BAN_DURATION_SECONDS=3600

# [LOGGING & VERBOSITY]
# Log levels: DEBUG, INFO, WARN, ERROR
LOG_LEVEL="INFO"
VERBOSE=false
